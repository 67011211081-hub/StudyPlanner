<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">
    <title>Study Planner | Login</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">💗</div>

        <div class="title">
            Study Planner
        </div>

        <div class="subtitle">
            ยินดีต้อนรับกลับ 💕
        </div>

        <form action="/login" method="POST">

            <label>👤 Username</label>

            <input
                type="text"
                name="username"
                placeholder="กรอกชื่อผู้ใช้"
                required
            >

            <label>🔒 Password</label>

            <input
                type="password"
                name="password"
                placeholder="กรอกรหัสผ่าน"
                required
            >

            <button type="submit">
                💖 เข้าสู่ระบบ
            </button>

        </form>

        <div class="link">

            ยังไม่มีบัญชี ?

            <a href="/">
                สมัครสมาชิก
            </a>

        </div>

    </div>

</div>

</body>
</html>
